<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC%3Awght%40100..900&family=Noto+Serif+SC%3Awght%40200..900&display=swap"
      rel="stylesheet"
    />

    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-name="09 · 首次使用与隐私选择"
      style="backdrop-filter: blur(14px); background-color: #FFFCF7F2; border-radius: 28px; border: 1px solid #FFFFFF; box-shadow: 0px 18px 48px #392D3424; box-sizing: border-box; height: 452px; position: relative; width: 580px"
    >
      <div
        data-pencil-name="欢迎来到 NovelMind"
        style='box-sizing: border-box; color: #302D29; font-family: "Noto Serif SC", system-ui, sans-serif; font-size: 28px; font-style: normal; font-weight: 400; left: 36px; letter-spacing: 0px; line-height: 46px; position: absolute; text-align: left; top: 36px; width: 508px; z-index: 0'
      >
        欢迎来到 NovelMind
      </div>
      <div
        data-pencil-name="开始前，了解一下你的内容会如何使用。"
        style='box-sizing: border-box; color: #78736C; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 14px; font-style: normal; font-weight: 400; left: 36px; letter-spacing: 0px; line-height: 23px; position: absolute; text-align: left; top: 102px; width: 508px; z-index: 1'
      >
        开始前，了解一下你的内容会如何使用。
      </div>
      <div
        data-pencil-name="导入与阅读保存在本机。"
        style='box-sizing: border-box; color: #51483F; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 17px; font-style: normal; font-weight: 400; left: 36px; letter-spacing: 0px; line-height: 28px; position: absolute; text-align: left; top: 145px; width: 508px; z-index: 2'
      >
        导入与阅读保存在本机。
      </div>
      <div
        data-pencil-name="使用摘要、人物分析、问答或报告时，相关正文、"
        style='box-sizing: border-box; color: #51483F; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 14px; font-style: normal; font-weight: 400; left: 36px; letter-spacing: 0px; line-height: 23px; position: absolute; text-align: left; top: 193px; width: 508px; z-index: 3'
      >
        使用摘要、人物分析、问答或报告时，相关正文、问题或派生资料会发送至你配置的文本生成与向量服务。目前为
        DeepSeek 与硅基流动。
      </div>
      <div
        data-pencil-name="选择“同意并开始”，表示你同意上述外部处理，"
        style='box-sizing: border-box; color: #51483F; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 14px; font-style: normal; font-weight: 400; left: 36px; letter-spacing: 0px; line-height: 23px; position: absolute; text-align: left; top: 259px; width: 508px; z-index: 4'
      >
        选择“同意并开始”，表示你同意上述外部处理，并确认拥有所处理内容的相应权利。
      </div>
      <div
        data-pencil-name="只在首次使用时询问。以后可在设置中查看或修改"
        style='box-sizing: border-box; color: #78736C; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 12px; font-style: normal; font-weight: 400; left: 36px; letter-spacing: 0px; line-height: 20px; position: absolute; text-align: left; top: 325px; width: 508px; z-index: 5'
      >
        只在首次使用时询问。以后可在设置中查看或修改。
      </div>
      <div
        data-pencil-name="首次使用操作"
        style="box-sizing: border-box; height: 48px; left: 36px; position: absolute; top: 365px; width: 508px; z-index: 6"
      >
        <div
          data-pencil-name="仅使用本地阅读"
          style="background-color: #EEE9E1; border-radius: 12px; box-sizing: border-box; height: 48px; left: 0px; position: absolute; top: 0px; width: 248px; z-index: 0"
        >
          <div
            data-pencil-name="仅使用本地阅读文字"
            style='box-sizing: border-box; color: #51483F; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 14px; font-style: normal; font-weight: 400; left: 75px; letter-spacing: 0px; line-height: normal; position: absolute; text-align: left; top: 14px; white-space: nowrap; z-index: 0'
          >
            仅使用本地阅读
          </div>
        </div>
        <div
          data-pencil-name="同意并开始"
          style="background-color: #37342F; border-radius: 12px; box-sizing: border-box; height: 48px; left: 260px; position: absolute; top: 0px; width: 248px; z-index: 1"
        >
          <div
            data-pencil-name="同意并开始文字"
            style='box-sizing: border-box; color: #FFFFFF; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 14px; font-style: normal; font-weight: 400; left: 89px; letter-spacing: 0px; line-height: normal; position: absolute; text-align: left; top: 14px; white-space: nowrap; z-index: 0'
          >
            同意并开始
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
