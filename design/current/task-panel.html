<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC%3Awght%40100..900&family=Noto+Serif+SC%3Awght%40200..900&display=swap"
      rel="stylesheet"
    />

    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-name="重构 · 按需任务面板"
      style="backdrop-filter: blur(12px); background-color: #FFFCF4EA; border-radius: 28px; border: 1px solid #FFFFFFCC; box-shadow: 0px 8px 28px #41302110; box-sizing: border-box; height: 568px; position: relative; width: 440px"
    >
      <div
        data-pencil-name="任务面板标题"
        style='box-sizing: border-box; color: #302B26; font-family: "Noto Serif SC", system-ui, sans-serif; font-size: 28px; font-style: normal; font-weight: 400; left: 28px; letter-spacing: 0px; line-height: 46px; position: absolute; text-align: left; top: 26px; width: 380px; z-index: 0'
      >
        任务
      </div>
      <div
        data-pencil-name="任务面板说明"
        style='box-sizing: border-box; color: #84796C; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 13px; font-style: normal; font-weight: 400; left: 28px; letter-spacing: 0px; line-height: 21px; position: absolute; text-align: left; top: 85px; width: 380px; z-index: 1'
      >
        所有生成任务，都在这里继续。
      </div>
      <div
        data-pencil-name="进行中的任务"
        style="background-color: #EFE8DD; border-radius: 18px; box-sizing: border-box; height: 174px; left: 20px; position: absolute; top: 137px; width: 400px; z-index: 2"
      >
        <div
          data-pencil-name="任务名称"
          style='box-sizing: border-box; color: #514A42; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 17px; font-style: normal; font-weight: 400; left: 18px; letter-spacing: 0px; line-height: 28px; position: absolute; text-align: left; top: 15px; width: 360px; z-index: 0'
        >
          补齐章节摘要
        </div>
        <div
          data-pencil-name="任务范围"
          style='box-sizing: border-box; color: #84796C; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 12px; font-style: normal; font-weight: 400; left: 18px; letter-spacing: 0px; line-height: 20px; position: absolute; text-align: left; top: 53px; width: 360px; z-index: 1'
        >
          雾港来信 · 剩余 32 章
        </div>
        <div
          data-pencil-name="任务进度轨道"
          style="background-color: #DBD1C2; border-radius: 2px; box-sizing: border-box; height: 5px; left: 18px; position: absolute; top: 97px; width: 362px; z-index: 2"
        ></div>
        <div
          data-pencil-name="任务进度条"
          style="background-color: #AA6C51; border-radius: 2px; box-sizing: border-box; height: 5px; left: 18px; position: absolute; top: 97px; width: 220px; z-index: 3"
        ></div>
        <div
          data-pencil-name="任务进行状态"
          style='box-sizing: border-box; color: #84796C; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 12px; font-style: normal; font-weight: 400; left: 18px; letter-spacing: 0px; line-height: 20px; position: absolute; text-align: left; top: 127px; width: 360px; z-index: 4'
        >
          正在整理第 116 章 · 20 / 32
        </div>
      </div>
      <div
        data-pencil-name="排队任务标题"
        style='box-sizing: border-box; color: #84796C; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 13px; font-style: normal; font-weight: 400; left: 28px; letter-spacing: 0px; line-height: 21px; position: absolute; text-align: left; top: 349px; width: 360px; z-index: 3'
      >
        接下来
      </div>
      <div
        data-pencil-name="排队任务"
        style='box-sizing: border-box; color: #514A42; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 18px; font-style: normal; font-weight: 400; left: 28px; letter-spacing: 0px; line-height: 30px; position: absolute; text-align: left; top: 386px; width: 370px; z-index: 4'
      >
        生成全书报告
      </div>
      <div
        data-pencil-name="任务面板底部"
        style='box-sizing: border-box; color: #84796C; font-family: "Noto Sans SC", system-ui, sans-serif; font-size: 13px; font-style: normal; font-weight: 400; left: 28px; letter-spacing: 0px; line-height: 21px; position: absolute; text-align: left; top: 479px; width: 380px; z-index: 5'
      >
        你可以关闭面板，继续阅读。
      </div>
    </div>
  </body>
</html>
